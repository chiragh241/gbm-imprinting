# Read processing: EM-seq (methylpy), RNA-seq and ChIP-seq alignment and allele splitting,
# variant calling between genome assemblies, and downloads from SRA/ENA.
# Versions are the ones the published results were produced with.
name: gi_reads
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.20
  - setuptools=75.8.0   # methylpy imports pkg_resources, which setuptools 84 no longer provides
  - methylpy=1.4.7
  - bowtie2=2.5.5
  - cutadapt=5.2
  - picard=3.4.0
  - samtools=1.23.1
  - htslib=1.23.1
  - bedtools=2.31.1
  - sra-tools=3.4.1
  - pysam=0.24.0
  - hisat2=2.2.1
  - subread=2.0.8
  - minimap2=2.28
  - snpsplit=0.6.0
  - pandas=2.3.3
  - numpy=2.2.6
  - scipy=1.15.2
  - wget
  - pigz
